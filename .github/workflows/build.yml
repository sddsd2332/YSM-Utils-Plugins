name: Build Blockbench Plugin

on:
  push:
    branches:
      - bb-5.x
      - main
      - master
  pull_request:
    branches:
      - bb-5.x
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ysm-utils.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check generated plugin
        run: node --check ysm-utils.js

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ysm-utils-bb5
          path: ysm-utils.js
          if-no-files-found: error
